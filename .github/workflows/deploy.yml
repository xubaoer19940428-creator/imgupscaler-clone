name: Deploy PhotoUpscale

on:
    workflow_dispatch:
        inputs:
            version:
                description: 部署版本或 Git ref（留空使用当前 ref；Release 使用 tag）
                required: false
                default: ''
                type: string
            rollback_only:
                description: 仅回滚到服务器上已有的版本
                required: false
                default: false
                type: boolean

    release:
        types: [published]

    # 如果需要 main 推送自动部署，可以取消下面注释。
    # push:
    #   branches: [main]

env:
    # GitHub Actions Secrets (仅需在仓库配置这 3 个):
    # - DEPLOY_HOST
    # - DEPLOY_USER
    # - DEPLOY_PASSWORD
    DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || '104.64.221.138' }}
    DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
    DEPLOY_BASE: /var/www/ai-nova/photoupscale
    APP_NAME: photoupscale
    APP_PORT: 3002
    KEEP_RELEASES: 5

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              if: ${{ !inputs.rollback_only }}
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.version || github.ref }}

            - name: Get version info
              id: version
              shell: bash
              run: |
                  if [ "${{ inputs.rollback_only }}" = "true" ]; then
                    VERSION="${{ inputs.version }}"
                    if [ -z "$VERSION" ]; then
                      echo "回滚模式需要填写 version"
                      exit 1
                    fi
                  elif [ -n "${{ github.event.release.tag_name }}" ]; then
                    VERSION="${{ github.event.release.tag_name }}"
                  elif [ -n "${{ inputs.version }}" ]; then
                    VERSION="${{ inputs.version }}"
                  else
                    VERSION="$(node -p "require('./package.json').version")"
                  fi

                  VERSION="${VERSION#v}"
                  VERSION="${VERSION//[^a-zA-Z0-9._-]/-}"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "部署版本: $VERSION"

            - name: Setup pnpm
              if: ${{ !inputs.rollback_only }}
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              if: ${{ !inputs.rollback_only }}
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              if: ${{ !inputs.rollback_only }}
              run: pnpm install --frozen-lockfile

            - name: Build project
              if: ${{ !inputs.rollback_only }}
              run: |
                  rm -rf .next
                  pnpm build
              env:
                  NEXT_PUBLIC_SITE_URL: https://photoupscale.app
                  NEXT_PUBLIC_SITE_INDEXABLE: 'true'
                  NEXT_PUBLIC_ARTGURU_API_BASE_URL: https://api.mixu.ai
                  NEXT_PUBLIC_ARTGURU_API_ENABLED: ${{ secrets.NEXT_PUBLIC_ARTGURU_API_ENABLED || 'false' }}
                  NEXT_PUBLIC_ARTGURU_APP_SECRET_KEY: ${{ secrets.NEXT_PUBLIC_ARTGURU_APP_SECRET_KEY }}
                  NEXT_PUBLIC_ARTGURU_UPSCALE_MODEL_SLUG: ${{ secrets.NEXT_PUBLIC_ARTGURU_UPSCALE_MODEL_SLUG }}
                  NEXT_PUBLIC_ARTGURU_UPSCALE_MODE: ${{ secrets.NEXT_PUBLIC_ARTGURU_UPSCALE_MODE }}
                  NEXT_PUBLIC_ARTGURU_IMAGE_MODEL_SLUG: ${{ secrets.NEXT_PUBLIC_ARTGURU_IMAGE_MODEL_SLUG }}
                  NEXT_PUBLIC_ARTGURU_IMAGE_MODE: ${{ secrets.NEXT_PUBLIC_ARTGURU_IMAGE_MODE }}

            - name: Install SSH tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y sshpass rsync

            - name: Prepare server directories
              env:
                  SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  sshpass -e ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "bash -se" <<EOF
                  set -eu
                  mkdir -p "$DEPLOY_BASE/releases" "$DEPLOY_BASE/shared"
                  if [ "${{ inputs.rollback_only }}" = "true" ]; then
                    if [ ! -d "$DEPLOY_BASE/releases/$VERSION" ]; then
                      echo "服务器上不存在版本 $VERSION"
                      ls -la "$DEPLOY_BASE/releases"
                      exit 1
                    fi
                  fi
                  EOF

            - name: Sync release to server
              if: ${{ !inputs.rollback_only }}
              env:
                  SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  RELEASE_DIR="$DEPLOY_BASE/releases/$VERSION"
                  set +e
                  sshpass -e rsync -rLDvz --copy-unsafe-links --ignore-errors \
                    -e "ssh -o StrictHostKeyChecking=no" \
                    --exclude 'node_modules' \
                    --exclude '.git' \
                    --exclude '.github' \
                    --exclude '.env*' \
                    --delete \
                    ./ "$DEPLOY_USER@$DEPLOY_HOST:$RELEASE_DIR/"
                  RSYNC_EXIT=$?
                  set -e

                  if [ "$RSYNC_EXIT" -ne 0 ] && [ "$RSYNC_EXIT" -ne 23 ] && [ "$RSYNC_EXIT" -ne 24 ]; then
                    echo "rsync failed with exit code $RSYNC_EXIT"
                    exit "$RSYNC_EXIT"
                  fi

            - name: Switch version and restart PM2
              env:
                  SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  sshpass -e ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "bash -se" <<EOF
                  set -eux

                  export NVM_DIR="\$HOME/.nvm"
                  [ -s "\$NVM_DIR/nvm.sh" ] && . "\$NVM_DIR/nvm.sh"
                  export PATH="\$HOME/.local/bin:\$HOME/.npm-global/bin:/usr/local/bin:\$PATH"
                  if command -v nvm >/dev/null 2>&1; then
                    nvm install 20
                    nvm use 20
                  fi
                  node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 20 || (major === 20 && minor < 9)) { console.error("Next.js requires Node >=20.9.0"); process.exit(1) }'
                  node --version

                  if ! command -v pm2 >/dev/null 2>&1; then
                    npm install -g pm2
                  fi

                  # 确保 PM2 进程守护和日志轮转配置存在。
                  pm2 install pm2-logrotate || true
                  pm2 set pm2-logrotate:max_size 10M
                  pm2 set pm2-logrotate:retain 30
                  pm2 set pm2-logrotate:compress true
                  pm2 set pm2-logrotate:rotateInterval '0 0 * * *'

                  RELEASE_DIR="$DEPLOY_BASE/releases/$VERSION"
                  CURRENT_LINK="$DEPLOY_BASE/current"

                  if [ "${{ inputs.rollback_only }}" != "true" ]; then
                    cd "\$RELEASE_DIR"
                    npm install -g pnpm@9
                    pnpm install --prod --frozen-lockfile --ignore-scripts || npm install --omit=dev --ignore-scripts
                  fi

                  # 在停止旧服务前验证发布文件与运行时依赖。
                  test -s "\$RELEASE_DIR/.next/BUILD_ID"
                  test -f "\$RELEASE_DIR/node_modules/next/dist/bin/next"
                  command -v curl

                  # 只重启当前应用，不清理其他站点进程。
                  pm2 delete "$APP_NAME" || true
                  ln -sfn "\$RELEASE_DIR" "\$CURRENT_LINK"
                  cd "\$CURRENT_LINK"

                  export NODE_ENV=production
                  export PORT="$APP_PORT"
                  export NEXT_PUBLIC_SITE_URL=https://photoupscale.app
                  export NEXT_PUBLIC_SITE_INDEXABLE=true
                  pm2 start "\$RELEASE_DIR/node_modules/next/dist/bin/next" \
                    --name "$APP_NAME" \
                    --cwd "\$RELEASE_DIR" \
                    --interpreter "\$(command -v node)" \
                    --update-env \
                    -- start --hostname 0.0.0.0 --port "$APP_PORT"

                  # 启动失败时让 workflow 失败，不保存不可用的部署。
                  HEALTHY=false
                  for attempt in {1..30}; do
                    STATUS="\$(curl --silent --show-error --max-time 3 -o /dev/null -w '%{http_code}' -H 'Host: photoupscale.app' "http://127.0.0.1:$APP_PORT/" || true)"
                    if [ "\$STATUS" = "200" ]; then
                      HEALTHY=true
                      break
                    fi
                    sleep 2
                  done
                  pm2 status
                  pm2 logs "$APP_NAME" --lines 50 --nostream || true
                  if [ "\$HEALTHY" != "true" ]; then
                    echo "PhotoUpscale failed health check on port $APP_PORT (HTTP \$STATUS)"
                    node --version
                    pm2 describe "$APP_NAME" || true
                    pm2 logs "$APP_NAME" --lines 150 --nostream || true
                    ss -ltnp || true
                    exit 1
                  fi
                  pm2 save
                  EOF

            - name: Cleanup old releases
              env:
                  SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
              run: |
                  sshpass -e ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "bash -se" <<EOF
                  set -eu
                  cd "$DEPLOY_BASE/releases"
                  # 当前运行版本占一个名额，回滚后也不会被清理。
                  ACTIVE_RELEASE="\$(readlink -f ../current)"
                  KEPT=0
                  if [ -d "\$ACTIVE_RELEASE" ]; then
                    KEPT=1
                  fi
                  mapfile -t RELEASE_DIRS < <(ls -1dt -- */)
                  for dir in "\${RELEASE_DIRS[@]}"; do
                    if [ "\$(readlink -f "\$dir")" = "\$ACTIVE_RELEASE" ]; then
                      continue
                    fi
                    if [ "\$KEPT" -lt "$KEEP_RELEASES" ]; then
                      KEPT=\$((KEPT + 1))
                    else
                      rm -rf -- "\$dir"
                    fi
                  done
                  EOF

            - name: Deployment summary
              run: |
                  echo "部署完成"
                  echo "版本: ${{ steps.version.outputs.version }}"
                  echo "服务器: $DEPLOY_USER@$DEPLOY_HOST"
                  echo "当前版本: $DEPLOY_BASE/current"
                  echo "应用: $APP_NAME，端口: $APP_PORT"
                  echo "站点: https://photoupscale.app（反向代理应指向 127.0.0.1:$APP_PORT）"
