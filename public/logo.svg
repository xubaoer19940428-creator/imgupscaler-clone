<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" fill="none" width="160" height="36">
  <!-- Brand Icon Mark (36x36) -->
  <g transform="translate(0, 0)">
    <!-- Base Container Layer -->
    <rect x="2" y="2" width="32" height="32" rx="8" fill="url(#logo_grad_dark)" />
    
    <!-- Subtle Inner Border Highlight -->
    <rect x="2.75" y="2.75" width="30.5" height="30.5" rx="7.25" stroke="url(#logo_grad_border)" stroke-width="1.5" />

    <!-- Low-res base pixel grid (representing input image) -->
    <rect x="8" y="19" width="4.5" height="4.5" rx="1.2" fill="#8898aa" fill-opacity="0.5" />
    <rect x="13.5" y="19" width="4.5" height="4.5" rx="1.2" fill="#8898aa" fill-opacity="0.8" />
    <rect x="8" y="24.5" width="4.5" height="4.5" rx="1.2" fill="#8898aa" fill-opacity="0.8" />
    <rect x="13.5" y="24.5" width="4.5" height="4.5" rx="1.2" fill="#8898aa" />

    <!-- Diagonal Dynamic Connection Beam -->
    <line x1="16.5" y1="19.5" x2="21" y2="15" stroke="url(#logo_grad_accent)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="0.1 3" />

    <!-- High-res AI Clarity / Super-Resolution Star (representing 4K upscale) -->
    <path d="M23.5 7.5 C23.5 11.2 20.2 13.5 17 13.5 C20.2 13.5 23.5 15.8 23.5 19.5 C23.5 15.8 26.8 13.5 30 13.5 C26.8 13.5 23.5 11.2 23.5 7.5 Z" fill="url(#logo_grad_sparkle)" />
    
    <!-- Micro clarity dots -->
    <circle cx="28" cy="8" r="1" fill="#60a5fa" />
  </g>

  <!-- Typography: Img.Upscaler -->
  <text x="46" y="25" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.04em" fill="#252a30">
    Img<tspan fill="#3b82f6">.</tspan><tspan font-weight="600" fill="#252a30">Upscaler</tspan>
  </text>

  <!-- Definitions / Gradients -->
  <defs>
    <linearGradient id="logo_grad_dark" x1="2" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a333f" />
      <stop offset="100%" stop-color="#181d24" />
    </linearGradient>
    <linearGradient id="logo_grad_border" x1="2" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="logo_grad_sparkle" x1="17" y1="7.5" x2="30" y2="19.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="logo_grad_accent" x1="16.5" y1="19.5" x2="21" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8898aa" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>
</svg>
